<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1A2333" />
      <stop offset="60%" stop-color="#10141D" />
      <stop offset="100%" stop-color="#090C12" />
    </radialGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2738" />
      <stop offset="100%" stop-color="#141A25" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#91A8FF" />
      <stop offset="100%" stop-color="#6485EE" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#63B995" />
      <stop offset="50%" stop-color="#7895F5" />
      <stop offset="100%" stop-color="#E5B66B" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(120, 149, 245, 0.2)" />
      <stop offset="100%" stop-color="rgba(120, 149, 245, 0.05)" />
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="shadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glowCompass" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#7895F5" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; fill: #F1F3F8; letter-spacing: -1.5px; }
    .subtitle { font-weight: 500; fill: #9AA5B7; }
    .tagline { font-weight: 600; fill: #7895F5; font-size: 14px; letter-spacing: 0.5px; text-transform: uppercase; }
    .card-title { font-weight: 700; fill: #F1F3F8; font-size: 15px; }
    .card-meta { font-weight: 500; fill: #8A97AC; font-size: 12px; }
    .stat-val { font-weight: 800; fill: #F1F3F8; font-size: 26px; }
    .stat-lbl { font-weight: 600; fill: #8A97AC; font-size: 12px; }
  </style>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  <rect width="1280" height="720" fill="url(#gridPattern)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="280" cy="220" r="280" fill="#7895F5" opacity="0.07" filter="blur(60px)" />
  <circle cx="1020" cy="440" r="320" fill="#63B995" opacity="0.05" filter="blur(70px)" />
  <circle cx="780" cy="180" r="240" fill="#E5B66B" opacity="0.04" filter="blur(60px)" />

  <!-- ========================================================================
       LEFT BRANDING HERO
       ======================================================================== -->
  <g transform="translate(80, 80)">
    
    <!-- Hackathon Track Pill -->
    <g transform="translate(0, 0)">
      <rect width="360" height="34" rx="17" fill="url(#badgeGrad)" stroke="rgba(120, 149, 245, 0.35)" stroke-width="1" />
      <circle cx="18" cy="17" r="4.5" fill="#63B995" />
      <text x="32" y="22" class="font-sans" fill="#D6E0FF" font-size="12" font-weight="600" letter-spacing="0.4">
        AMAZON DEVELOPER HACKATHON 2026
      </text>
    </g>

    <!-- Compass Logo + Brand Name -->
    <g transform="translate(0, 60)">
      <!-- LifePilot Compass Emblem -->
      <g filter="url(#glowCompass)">
        <rect width="64" height="64" rx="18" fill="#18202D" stroke="rgba(120, 149, 245, 0.4)" stroke-width="1.5" />
        <circle cx="32" cy="32" r="22" fill="none" stroke="#2A3445" stroke-width="2.5" />
        <polygon points="32,15 37,30 32,27 27,30" fill="#7895F5" />
        <polygon points="32,49 37,34 32,37 27,34" fill="#425575" />
        <circle cx="32" cy="32" r="3" fill="#F1F3F8" />
      </g>

      <text x="82" y="44" class="font-sans title" font-size="44">LifePilot<tspan fill="#7895F5"> AI</tspan></text>
    </g>

    <!-- Headline Tagline -->
    <g transform="translate(0, 175)">
      <text x="0" y="0" class="font-sans title" font-size="40" line-height="1.15">
        <tspan x="0" dy="0">Your Personal</tspan>
        <tspan x="0" dy="50" fill="url(#primaryGrad)">Productivity Copilot.</tspan>
      </text>
      <text x="0" y="125" class="font-sans subtitle" font-size="17" fill="#9AA5B7">
        Make space for what matters with intelligent daily planning,
      </text>
      <text x="0" y="150" class="font-sans subtitle" font-size="17" fill="#9AA5B7">
        Eisenhower prioritization, and conversational execution.
      </text>
    </g>

    <!-- Feature Pillars List -->
    <g transform="translate(0, 375)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="28" height="28" rx="8" fill="rgba(120, 149, 245, 0.15)" stroke="rgba(120, 149, 245, 0.3)" />
        <text x="14" y="19" text-anchor="middle" font-size="14">✦</text>
        <text x="40" y="19" class="font-sans" fill="#F1F3F8" font-size="15" font-weight="600">Simulated Alexa+ Conversational Assistant</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(0, 42)">
        <rect width="28" height="28" rx="8" fill="rgba(99, 185, 149, 0.15)" stroke="rgba(99, 185, 149, 0.3)" />
        <text x="14" y="19" text-anchor="middle" font-size="14">✓</text>
        <text x="40" y="19" class="font-sans" fill="#F1F3F8" font-size="15" font-weight="600">Unified Single-Source Task &amp; Plan Engine</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(0, 84)">
        <rect width="28" height="28" rx="8" fill="rgba(229, 182, 107, 0.15)" stroke="rgba(229, 182, 107, 0.3)" />
        <text x="14" y="19" text-anchor="middle" font-size="14">⚙</text>
        <text x="40" y="19" class="font-sans" fill="#F1F3F8" font-size="15" font-weight="600">Amazon Bedrock Claude 3.5 Sonnet Integration</text>
      </g>
    </g>

    <!-- Bottom Tech Pills -->
    <g transform="translate(0, 525)">
      <rect width="90" height="28" rx="14" fill="#18202E" stroke="#2A3445" />
      <text x="45" y="18" text-anchor="middle" class="font-sans" fill="#8A97AC" font-size="11" font-weight="600">Alexa+</text>

      <rect x="100" width="130" height="28" rx="14" fill="#18202E" stroke="#2A3445" />
      <text x="165" y="18" text-anchor="middle" class="font-sans" fill="#8A97AC" font-size="11" font-weight="600">AWS Bedrock</text>

      <rect x="240" width="130" height="28" rx="14" fill="#18202E" stroke="#2A3445" />
      <text x="305" y="18" text-anchor="middle" class="font-sans" fill="#8A97AC" font-size="11" font-weight="600">AWS Builder</text>

      <rect x="380" width="105" height="28" rx="14" fill="#18202E" stroke="#2A3445" />
      <text x="432" y="18" text-anchor="middle" class="font-sans" fill="#8A97AC" font-size="11" font-weight="600">Node/Express</text>
    </g>

  </g>

  <!-- ========================================================================
       RIGHT FLOATING UI MOCKUPS
       ======================================================================== -->
  <g transform="translate(680, 75)">

    <!-- BACKDROP GLOW -->
    <rect x="-10" y="10" width="530" height="560" rx="24" fill="#141A25" opacity="0.4" filter="blur(20px)" />

    <!-- MAIN DASHBOARD WINDOW (Floating Mockup) -->
    <g filter="url(#shadowLg)">
      <!-- Window Frame -->
      <rect width="520" height="560" rx="18" fill="url(#cardGrad)" stroke="#2A3445" stroke-width="1.5" />
      
      <!-- Window Header Bar -->
      <path d="M 0,18 Q 0,0 18,0 L 502,0 Q 520,0 520,18 L 520,48 L 0,48 Z" fill="#18202D" />
      <line x1="0" y1="48" x2="520" y2="48" stroke="#252F42" stroke-width="1" />
      
      <!-- Window Controls -->
      <circle cx="24" cy="24" r="5" fill="#E06C75" />
      <circle cx="40" cy="24" r="5" fill="#E5B66B" />
      <circle cx="56" cy="24" r="5" fill="#63B995" />

      <!-- Window Title & Tabs -->
      <text x="260" y="29" text-anchor="middle" class="font-sans" fill="#8A97AC" font-size="12" font-weight="600">
        LifePilot Workspace · Overview
      </text>

      <!-- 3 Metrics Cards Row -->
      <g transform="translate(20, 68)">
        <!-- Metric 1: Tasks -->
        <g>
          <rect width="150" height="80" rx="10" fill="#10141D" stroke="#252F42" stroke-width="1" />
          <line x1="0" y1="1" x2="150" y2="1" stroke="#7895F5" stroke-width="2" />
          <text x="14" y="24" class="font-sans stat-lbl">TOTAL TASKS</text>
          <text x="14" y="56" class="font-sans stat-val">4</text>
          <text x="35" y="54" class="font-sans" fill="#8A97AC" font-size="11">· 3 active</text>
        </g>

        <!-- Metric 2: Progress -->
        <g transform="translate(162, 0)">
          <rect width="150" height="80" rx="10" fill="#10141D" stroke="#252F42" stroke-width="1" />
          <line x1="0" y1="1" x2="150" y2="1" stroke="#63B995" stroke-width="2" />
          <text x="14" y="24" class="font-sans stat-lbl">PROGRESS</text>
          <text x="14" y="56" class="font-sans stat-val" fill="#63B995">25%</text>
          <!-- Mini Progress Bar -->
          <rect x="14" y="64" width="122" height="4" rx="2" fill="#202A38" />
          <rect x="14" y="64" width="31" height="4" rx="2" fill="#63B995" />
        </g>

        <!-- Metric 3: Focus Time -->
        <g transform="translate(324, 0)">
          <rect width="156" height="80" rx="10" fill="#10141D" stroke="#252F42" stroke-width="1" />
          <line x1="0" y1="1" x2="156" y2="1" stroke="#E5B66B" stroke-width="2" />
          <text x="14" y="24" class="font-sans stat-lbl">FOCUS TIME</text>
          <text x="14" y="56" class="font-sans stat-val" font-size="20">4h 15m</text>
        </g>
      </g>

      <!-- Section: Today's Priorities -->
      <g transform="translate(20, 168)">
        <text x="0" y="0" class="font-sans" fill="#8A97AC" font-size="11" font-weight="700" letter-spacing="0.6">
          TODAY'S PRIORITIES
        </text>

        <!-- Task Item 1 -->
        <g transform="translate(0, 12)">
          <rect width="480" height="52" rx="8" fill="#10141D" stroke="#232C3E" stroke-width="1" />
          <!-- Custom Checkbox -->
          <rect x="14" y="17" width="18" height="18" rx="4" fill="#10141D" stroke="#4F6488" stroke-width="1.5" />
          <text x="44" y="28" class="font-sans card-title">Review Java Object-Oriented Principles</text>
          <!-- Metadata -->
          <rect x="44" y="34" width="46" height="15" rx="3" fill="rgba(224, 108, 117, 0.15)" />
          <text x="67" y="45" text-anchor="middle" class="font-sans" fill="#E06C75" font-size="9" font-weight="700">HIGH</text>
          <rect x="96" y="34" width="48" height="15" rx="3" fill="rgba(120, 149, 245, 0.15)" />
          <text x="120" y="45" text-anchor="middle" class="font-sans" fill="#7895F5" font-size="9" font-weight="600">STUDY</text>
          <text x="152" y="45" class="font-sans card-meta">· Due tomorrow · ⏱️ 2h</text>
        </g>

        <!-- Task Item 2 -->
        <g transform="translate(0, 72)">
          <rect width="480" height="52" rx="8" fill="#10141D" stroke="#232C3E" stroke-width="1" />
          <rect x="14" y="17" width="18" height="18" rx="4" fill="#10141D" stroke="#4F6488" stroke-width="1.5" />
          <text x="44" y="28" class="font-sans card-title">Deploy LifePilot AI web app to AWS hosting</text>
          <rect x="44" y="34" width="46" height="15" rx="3" fill="rgba(224, 108, 117, 0.15)" />
          <text x="67" y="45" text-anchor="middle" class="font-sans" fill="#E06C75" font-size="9" font-weight="700">HIGH</text>
          <rect x="96" y="34" width="56" height="15" rx="3" fill="rgba(86, 182, 194, 0.15)" />
          <text x="124" y="45" text-anchor="middle" class="font-sans" fill="#56B6C2" font-size="9" font-weight="600">CODING</text>
          <text x="160" y="45" class="font-sans card-meta">· Due in 2 days · ⏱️ 1.5h</text>
        </g>

        <!-- Task Item 3 -->
        <g transform="translate(0, 132)">
          <rect width="480" height="52" rx="8" fill="#10141D" stroke="#232C3E" stroke-width="1" />
          <rect x="14" y="17" width="18" height="18" rx="4" fill="#10141D" stroke="#4F6488" stroke-width="1.5" />
          <text x="44" y="28" class="font-sans card-title">Prepare slides and architecture demo video</text>
          <rect x="44" y="34" width="54" height="15" rx="3" fill="rgba(229, 182, 107, 0.15)" />
          <text x="71" y="45" text-anchor="middle" class="font-sans" fill="#E5B66B" font-size="9" font-weight="700">MEDIUM</text>
          <rect x="104" y="34" width="48" height="15" rx="3" fill="rgba(198, 120, 221, 0.15)" />
          <text x="128" y="45" text-anchor="middle" class="font-sans" fill="#C678DD" font-size="9" font-weight="600">WORK</text>
          <text x="160" y="45" class="font-sans card-meta">· ⏱️ 45m</text>
        </g>
      </g>

      <!-- Section: Assistant Live Chat Preview (Bottom Overlay) -->
      <g transform="translate(20, 380)">
        <rect width="480" height="150" rx="10" fill="#121722" stroke="rgba(120, 149, 245, 0.3)" stroke-width="1" />
        
        <!-- Header -->
        <g transform="translate(16, 18)">
          <circle cx="8" cy="8" r="8" fill="rgba(120, 149, 245, 0.2)" />
          <text x="8" y="12" text-anchor="middle" font-size="10" fill="#7895F5">✦</text>
          <text x="24" y="12" class="font-sans" fill="#F1F3F8" font-size="13" font-weight="700">LifePilot Assistant</text>
          <text x="140" y="12" class="font-sans" fill="#8A97AC" font-size="11">· Claude 3.5 Sonnet</text>
        </g>

        <!-- Message Snippet -->
        <g transform="translate(16, 46)">
          <rect width="448" height="52" rx="8" fill="#18202D" />
          <text x="14" y="22" class="font-sans" fill="#E6EDF6" font-size="12">
            "I've organized your day around 3 high-priority deliverables."
          </text>
          <text x="14" y="38" class="font-sans" fill="#7895F5" font-size="11" font-weight="600">
            ✓ 5-Day Java Study Plan · ✓ Workload Rebalanced
          </text>
        </g>

        <!-- Action Button -->
        <g transform="translate(16, 108)">
          <rect width="170" height="28" rx="6" fill="#7895F5" />
          <text x="85" y="18" text-anchor="middle" class="font-sans" fill="#FFFFFF" font-size="11" font-weight="700">
            🗓️ Create my daily plan
          </text>
        </g>

      </g>

    </g>

  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="716" width="1280" height="4" fill="url(#accentLine)" />
</svg>
